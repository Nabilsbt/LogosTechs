<div class="container py-4">
  <div class="d-flex justify-content-between align-items-center mb-3">
    <h2 class="m-0">Événements</h2>
    <button class="btn btn-primary" (click)="create()">
      <i class="fas fa-plus me-1"></i> Nouveau
    </button>
  </div>

  <div *ngIf="loading" class="alert alert-info">Chargement...</div>
  <div *ngIf="error" class="alert alert-danger">{{ error }}</div>

  <div class="table-responsive" *ngIf="!loading && events?.length">
    <table class="table table-striped align-middle">
      <thead>
        <tr>
          <th>#</th>
          <th>Titre</th>
          <th>Date</th>
          <th>Lieu</th>
          <th>Type</th>
          <th style="width: 220px;">Actions</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let e of events">
          <td>{{ e.id }}</td>
          <td>{{ e.title }}</td>
          <td>{{ e.date | date: 'yyyy-MM-dd' }}</td>
          <td>{{ e.location }}</td>
          <td><span class="badge bg-secondary">{{ e.type }}</span></td>
          <td>
            <button class="btn btn-sm btn-outline-info me-2" (click)="view(e)">
              <i class="fas fa-eye"></i>
            </button>
            <button class="btn btn-sm btn-outline-warning me-2" (click)="edit(e)">
              <i class="fas fa-edit"></i>
            </button>
            <button class="btn btn-sm btn-outline-danger" (click)="remove(e)">
              <i class="fas fa-trash"></i>
            </button>
          </td>
        </tr>
      </tbody>
    </table>
  </div>

  <div *ngIf="!loading && !events?.length" class="alert alert-light border">
    Aucun événement pour le moment.
  </div>
</div>
