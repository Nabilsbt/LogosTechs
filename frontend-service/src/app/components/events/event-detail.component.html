<div class="container py-4" *ngIf="!loading">
  <a class="btn btn-light border mb-3" [routerLink]="['/events']">
    <i class="fas fa-arrow-left me-1"></i> Retour
  </a>

  <div *ngIf="error" class="alert alert-danger">{{ error }}</div>

  <div *ngIf="event" class="card">
    <div class="card-body">
      <h3 class="card-title d-flex align-items-center justify-content-between">
        <span>{{ event.title }}</span>
        <span class="badge bg-secondary">{{ event.type }}</span>
      </h3>
      <p class="text-muted mb-2">
        <i class="far fa-calendar-alt me-1"></i> {{ event.date | date: 'fullDate' }}
      </p>
      <p class="mb-2">
        <i class="fas fa-map-marker-alt me-1"></i> {{ event.location }}
      </p>
      <p class="mb-0">{{ event.description }}</p>
    </div>
  </div>
</div>
