spring.application.name=urgences
server.port=8082

# H2 Database Configuration
spring.datasource.url=jdbc:h2:mem:urgences_db
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=nabil
spring.datasource.password=

# JPA Configuration
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
spring.jpa.properties.hibernate.format_sql=true

# H2 Console Configuration
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Eureka Client Configuration (disabled for now)
# eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
# eureka.instance.prefer-ip-address=true

# Actuator Configuration
management.endpoints.web.exposure.include=*
management.endpoint.health.show-details=always
#a supprimer dès que je fait atelier config server !
spring.cloud.config.enabled=false
spring.cloud.config.import-check.enabled=false
