server.port=8081
spring.application.name=hopital-service

# MySQL Database Configuration
spring.datasource.url=jdbc:mysql://localhost:3306/hopital_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.username=root
spring.datasource.password=

# JPA Configuration for MySQL
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.time_zone=UTC


# Actuator Configuration
management.endpoints.web.exposure.include=*
management.endpoint.health.show-details=always

# Configuration Server (disabled for now)
spring.cloud.config.enabled=false
spring.cloud.config.import-check.enabled=false