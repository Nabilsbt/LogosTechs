<div class="container mt-4">
  <div class="row">
    <div class="col-12">
      <h2>Gestion des Hôpitaux</h2>
      
      <!-- Barre de recherche -->
      <div class="row mb-3">
        <div class="col-md-6">
          <div class="input-group">
            <input type="text" class="form-control" placeholder="Rechercher un hôpital..." 
                   [(ngModel)]="searchKeyword" (keyup.enter)="search()">
            <button class="btn btn-outline-secondary" type="button" (click)="search()" aria-label="Rechercher">
              <i class="fas fa-search me-1" aria-hidden="true"></i> Rechercher
            </button>
          </div>
        </div>
        <div class="col-md-6 text-end">
          <button class="btn btn-primary" routerLink="/hopitaux/create" aria-label="Ajouter un hôpital">
            <i class="fas fa-plus me-1" aria-hidden="true"></i> Ajouter un Hôpital
          </button>
        </div>
      </div>

      <!-- Tableau des hôpitaux -->
      <div class="table-responsive">
        <table class="table table-striped table-hover">
          <thead class="table-dark">
            <tr>
              <th>ID</th>
              <th>Nom</th>
              <th>Adresse</th>
              <th>Téléphone</th>
              <th>Email</th>
              <th>Type</th>
              <th>Capacité</th>
              <th>Actions</th>
            </tr>
          </thead>
          <tbody>
            <tr *ngFor="let hopital of hopitaux">
              <td>{{ hopital.id }}</td>
              <td>{{ hopital.nom }}</td>
              <td>{{ hopital.adresse }}</td>
              <td>{{ hopital.telephone }}</td>
              <td>{{ hopital.email }}</td>
              <td>
                <span class="badge" [ngClass]="{
                  'bg-success': hopital.type === 'public',
                  'bg-warning': hopital.type === 'prive'
                }">
                  {{ hopital.type | titlecase }}
                </span>
              </td>
              <td>
                <span class="badge bg-info">{{ hopital.capaciteLits }} lits</span>
              </td>
              <td>
                <button class="btn btn-sm btn-outline-primary me-1" 
                        [routerLink]="hopital.id ? ['/hopitaux/edit', hopital.id] : null"
                        [disabled]="!hopital.id"
                        aria-label="Modifier">
                  <i class="fas fa-edit me-1" aria-hidden="true"></i> Modifier
                </button>
                <button class="btn btn-sm btn-outline-danger" 
                        (click)="hopital.id && deleteHopital(hopital.id)"
                        [disabled]="!hopital.id"
                        aria-label="Supprimer">
                  <i class="fas fa-trash-alt me-1" aria-hidden="true"></i> Supprimer
                </button>
              </td>
            </tr>
          </tbody>
        </table>
        
        <div *ngIf="hopitaux.length === 0" class="text-center text-muted mt-4">
          Aucun hôpital trouvé.
        </div>
      </div>
    </div>
  </div>
</div>
